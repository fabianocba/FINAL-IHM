<script>
    // Renderiza novas consultas confirmadas após o pagamento
    const listaContainer = document.querySelector(".lista-consultas");
    const consultasSalvas = JSON.parse(localStorage.getItem("consultasSalvas")) || [];

    consultasSalvas.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card-consulta";
        card.innerHTML = `
            <div class="consulta-topo">
                <span class="status-confirmado">Consulta confirmada</span>
                <span class="consulta-codigo">#CS00${index + 3}</span>
            </div>
            <div class="consulta-info">
                <div class="consulta-icone" aria-hidden="true">✚</div>
                <div>
                    <h3>Consulta ${item.especialidade}</h3>
                    <p>${item.profissional}</p>
                </div>
            </div>
            <div class="consulta-detalhes">
                <div><span>Data</span><strong>${item.data}</strong></div>
                <div><span>Horário</span><strong>${item.horario}</strong></div>
                <div><span>Modalidade</span><strong>${item.modalidade}</strong></div>
            </div>
            <div class="consulta-rodape">
                <a href="../pagamento.html" class="link-detalhes">Comprovante</a>
                <button type="button" class="botao-cancelar">Cancelar consulta</button>
            </div>
        `;
        listaContainer.appendChild(card);
    });

    // Envia dados do formulário para a tela de pagamento
    const formAg = document.getElementById("formAgendamento");
    if (formAg) {
        formAg.addEventListener("submit", function(e) {
            e.preventDefault();
            const selects = formAg.querySelectorAll("select");
            const dataInput = formAg.querySelector("input[type='date']").value;
            const partes = dataInput.split("-");
            const dataBR = partes.length === 3 ? `${partes}/${partes}/${partes}` : dataInput;

            const novaConsulta = {
                especialidade: selects.value,
                profissional: selects.value,
                data: dataBR,
                horario: selects.value,
                modalidade: selects.value
            };

            localStorage.setItem("novaConsulta", JSON.stringify(novaConsulta));
            window.location.href = "../pagamento.html";
        });
    }

    // Cancela consulta com confirmação
    listaContainer.addEventListener("click", function(e) {
        if (e.target.classList.contains("botao-cancelar")) {
            if (confirm("Deseja realmente cancelar esta consulta?")) {
                e.target.closest(".card-consulta").remove();
            }
        }
    });
</script>
