<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento</title>
</head>
<body>
    <header>
        <nav> 
            <img src="../assets/images/logo.png" width="90"> 
            
            <div>
                <a href="../index.html">Home</a>
                <a href="#">Serviços</a>
                <a href="#">Contato</a>
                <a href="#">Conta Paciente</a>
            </div>
        </nav>
    </header>

    <section class="banner">
        <h1>Pagamento</h1>
        <p>Confira os dados da consulta e escolha a forma de pagamento</p>
    </section>

    <!--Dados do agendamento-->
    
    <main class="container">
        <h2>Dados da consulta</h2>

            <p>
                <strong>Especialidade:</strong>
                <span id="especialidade"></span>
            </p>

            <p>
                <strong>Profissional:</strong>
                <span id="profissional"></span>
            </p>

            <p>
                <strong>Data:</strong>
                <span id="data-consulta"></span>
            </p>

            <p>
                <strong>Horário:</strong>
                <span id="horario"></span>
            </p>

        </section>

        <!--Formas de pagamento-->

        <section class="formas-pagamento">

            <h2>Formas de pagamento</h2>

            <p>Selecione uma opção:</p>

            <label>
                <input type="radio" name="pagamento" value="pix">
                Pix
            </label>

            <label>
                <input type="radio" name="pagamento" value="credito">
                Cartão de crédito
            </label>

            <label>
                <input type="radio" name="pagamento" value="dinheiro">
                Pagamento Presencial (Pague diretamente na clínica em até 5 dias após a confirmação do agendamento)
            </label>

        </section>

        <!--Valor da consulta e confirmação-->
        <section class="valor-consulta">

            <h2>Valor da consulta:</h2>

            <p id="valor-total"></p>

            <button type="button" id="btn-confirmar">
                Confirmar agendamento
            </button>

        </section>

    </main>

    <footer>
        <img src="../assets/images/logo.png" width="100">
    </footer>

    </main>

</body>
</html>
